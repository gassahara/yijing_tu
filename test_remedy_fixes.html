// Simplified format functions for testing
function formatMarkdownInline(text) {
    if (!text) return '';
    // Remove bracket headers like [Instrucciones Taoístas Auténticas], [Uso para tu Consulta], etc.
    let result = text.replace(/^\[[^\]]+\]\s*\n?/gm, '').trim();
    // Convert **bold** to <strong>, *italic* to <em> (order matters: bold first)
    result = result.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    result = result.replace(/(?<!\w)\*([^*]+?)\*(?!\w)/g, '<em>$1</em>');
    return result;
}

function parseCharmText(charmText) {
    const parts = {
        chinese: '',
        pinyin: '',
        translation: '',
        purpose: ''
    };

    if (!charmText) return parts;

    // Remove bracketed headers like [Instrucciones Taoístas Auténticas], [Uso para tu Consulta], etc.
    let cleanedText = charmText
        .replace(/^\[[^\]]+\]\s*\n?/gm, '')
        .replace(/\[Chinese\]\s*\n?/gi, '')
        .replace(/\[Pinyin\]\s*\n?/gi, '')
        .replace(/\[(?:Translation|Traducción|Traduzione|說明)\]\s*\n?/gi, '')
        .replace(/\[(?:Purpose|Propósito|用途|Uso)\]\s*\n?/gi, '')
        .replace(/\[Instrucciones[^\]]*\]\s*\n?/gi, '')
        .replace(/\[Uso[^\]]*\]\s*\n?/gi, '')
        .trim();

    // Try to parse sections marked with standardized headers (after cleaning)
    const chineseMatch = cleanedText.match(/^([^\n]+)(?:\n|$)/);
    const pinyinMatch = cleanedText.match(/\n([^\n]+)\n/);
    const translationMatch = cleanedText.match(/\n\n(.+)$/s);

    if (chineseMatch) parts.chinese = chineseMatch[1].trim();
    if (pinyinMatch) parts.pinyin = pinyinMatch[1].trim();
    if (translationMatch) parts.translation = translationMatch[1].trim();

    // If no structured format found, try to split by double newlines
    if (!parts.chinese && !parts.pinyin && !parts.translation) {
        const sections = cleanedText.split(/\n\n+/).filter(s => s.trim());
        if (sections.length >= 3) {
            parts.chinese = sections[0].trim();
            parts.pinyin = sections[1].trim();
            parts.translation = sections[2].trim();
        } else if (sections.length === 2) {
            parts.pinyin = sections[0].trim();
            parts.translation = sections[1].trim();
        } else {
            parts.translation = cleanedText.trim();
        }
    }

    return parts;
}

// Display test results
