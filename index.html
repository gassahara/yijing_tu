<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易經圖 · I Ching Oracle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tabbed-layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Blocking Loading Overlay with I Ching & Laozi Quotes -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <!-- Animated Spinner -->
            <div class="loading-spinner-container">
                <div class="loading-spinner"></div>
                <div class="loading-spinner-inner"></div>
                <div class="loading-spinner-center"></div>
            </div>
            
            <!-- Prominent Quote Display -->
            <div class="quote-container" id="quoteContainer">
                <div class="quote-chinese" id="quoteChinese"></div>
                <div class="quote-text" id="quoteText"></div>
                <div class="quote-source" id="quoteSource"></div>
            </div>
            
            <!-- Process Status -->
            <div class="process-status">
                <div class="process-step" id="processStep">Initializing...</div>
                <div class="progress-container">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <!-- Debug Console (Less Prominent) -->
            <div class="debug-container">
                <div class="debug-header">
                    <span class="debug-title">System Log</span>
                    <span class="debug-status" id="debugStatus">● Processing</span>
                </div>
                <div class="debug-messages" id="debugMessages"></div>
            </div>
        </div>
    </div>

    <!-- Redirect to main application -->
    <script>
        window.location.href = 'yijingtu.html';
    </script>
</body>
</html>
